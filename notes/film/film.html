<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion, measurement, acceleration</title>
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<style>
  html, body { margin: 0; background: #f6f4ee; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  canvas { position: absolute; inset: 0; }
  .eq { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; white-space: nowrap;
        color: #1c1d21; font-size: 40px; opacity: 0; will-change: opacity, transform; }
  .eq .katex { font-size: 1em; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="eqs"></div></div>
<script src="node_modules/katex/dist/katex.min.js"></script>
<script src="labels.zh.js"></script>
<script src="film.js"></script>
</body>
</html>
