[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformatics"
version = "1.0.0"
description = "Open textbook: finite transformations, observables, flows and transfer between models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hunter Bown"}]
keywords = ["transformations", "dynamical systems", "finite differences", "operators"]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
book = ["Markdown==3.8.2"]
test = ["pytest>=8.0.0", "sympy>=1.12"]

[tool.setuptools.packages.find]
include = ["transformatics*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
